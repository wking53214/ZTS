name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The whole suite without CNS. The CNS connector tests skip here; the
    # independence and version-rule tests run, since they need no CNS.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with the dev extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the test suite without CNS
        run: python -m pytest tests/ -q -rs

  cns:
    # The CNS dock (zts.cns) with the cns extra installed. ZTS_REQUIRE_CNS=1
    # turns a missing cns into a failure, so the connector tests cannot
    # silently skip here.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with the dev and cns extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,cns]"
          python -m pip show cns

      - name: Run the test suite with CNS present
        env:
          ZTS_REQUIRE_CNS: "1"
        run: python -m pytest tests/ -q -rs

  enforcer:
    # The release boundary against the real CNS and the real Enforcer. Both
    # REQUIRE flags turn a missing package into a failure, so the adversarial
    # suite cannot silently skip here.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with the dev, cns and enforcer extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,cns,enforcer]"
          python -m pip show cns tack-enforcer

      - name: Run the test suite with CNS and Enforcer present
        env:
          ZTS_REQUIRE_CNS: "1"
          ZTS_REQUIRE_ENFORCER: "1"
        run: python -m pytest tests/ -q -rs

  production-stack:
    # Every real component at once: the Ed25519 verifier, the HTTPS status client, a real PostgreSQL
    # server for the replay store, and an RFC 3161 anchor against OpenSSL's independent TSA. The
    # REQUIRE flags make a missing piece a failure instead of a skip. ubuntu-latest ships the
    # PostgreSQL 16 server binaries; the tests start and stop their own throwaway cluster.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the production extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,cns,enforcer,trust,replay-postgres,tsa]"
          openssl version
          ls /usr/lib/postgresql/*/bin/initdb

      - name: Run the whole suite against the real stack
        env:
          ZTS_REQUIRE_CNS: "1"
          ZTS_REQUIRE_ENFORCER: "1"
          ZTS_REQUIRE_POSTGRES: "1"
          ZTS_REQUIRE_TSA: "1"
          ZTS_REQUIRE_ENFORCER_011: "1"
        run: python -m pytest tests/ -q -rs

  cns-3:
    # The same stack with CNS 3.0.0 over the pinned 2.3.0, to hold the dock's acceptance of major 3.
    # ZTS_REQUIRE_CNS_3=1 turns a CNS that is not 3.x into a failure, so tests/test_cns_three.py cannot skip.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the production extras, then CNS 3.0.0 over the pinned release
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,cns,enforcer,trust,replay-postgres,tsa]"
          python -m pip install --no-deps "cns @ git+https://github.com/wking53214/CNS.git@v3.0.0"
          python -m pip show cns
      - name: Run the whole suite against CNS 3.0.0
        env:
          ZTS_REQUIRE_CNS: "1"
          ZTS_REQUIRE_CNS_3: "1"
          ZTS_REQUIRE_ENFORCER: "1"
          ZTS_REQUIRE_POSTGRES: "1"
          ZTS_REQUIRE_TSA: "1"
          ZTS_REQUIRE_ENFORCER_011: "1"
        run: python -m pytest tests/ -q -rs
