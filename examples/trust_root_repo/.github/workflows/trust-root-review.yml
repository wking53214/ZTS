# Runs ZTS's trust-root review tool on every pull request that touches trust-root.json, and puts its output on the PR
# so the second person has something concrete to approve. Copy this into the repository that holds trust-root.json.
#
# What it enforces: the file is valid under ZTS's own parser, the serial rises, no revoked key becomes active again, and
# no key id changes role or issuer. What it cannot do: judge whether the keys are the right ones. That is the reviewer.
#
# Set up once (see README.md): the secret ZTS_READ_TOKEN (read access to the ZTS repository, if it is private), the
# variable ZTS_COMMIT (the ZTS commit you reviewed and pin; never a branch name), and branch protection that makes this
# check and a code-owner review required.
name: trust-root-review

on:
  pull_request:          # never pull_request_target: that would run the PR's own code with this repository's secrets
    paths:
      - trust-root.json
      - .github/**
      - CODEOWNERS

permissions:
  contents: read

jobs:
  review:
    name: trust-root-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: wking53214/ZTS
          ref: ${{ vars.ZTS_COMMIT }}
          token: ${{ secrets.ZTS_READ_TOKEN }}
          path: zts
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Review the change against the file that is live on the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ZTS_DIR: ${{ github.workspace }}/zts
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          file=trust-root.json
          previous=()
          if git cat-file -e "$BASE_SHA:$file" 2>/dev/null; then
            git show "$BASE_SHA:$file" > "$RUNNER_TEMP/previous.json"
            if cmp -s "$RUNNER_TEMP/previous.json" "$file"; then
              echo "$file is unchanged in this pull request: checking that it is valid, with nothing to compare."
            else
              previous=(--previous "$RUNNER_TEMP/previous.json")
            fi
          else
            echo "No $file on the base branch: this is the first version, so there is nothing to compare."
          fi
          set +e
          PYTHONPATH="$ZTS_DIR/src" python "$ZTS_DIR/scripts/trust_root_review.py" "$file" "${previous[@]}" | tee "$RUNNER_TEMP/review.txt"
          code=${PIPESTATUS[0]}
          set -e
          { echo '### Trust-root review'; echo '```'; cat "$RUNNER_TEMP/review.txt"; echo '```'; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          exit "$code"
