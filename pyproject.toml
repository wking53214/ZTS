[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zts"
version = "13.0.0"
description = "Zero Trust Stack: a deterministic linguistic filtration array (G1-G7)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "William N. King" }]
keywords = ["llm", "filter", "governance", "middleware", "sycophancy", "zero-trust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Filters",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Optional: the CNS dock (zts.cns). Nothing else in ZTS imports CNS, and ZTS runs without it.
cns = ["cns @ git+https://github.com/wking53214/CNS.git@v2.3.0"]
# Optional: the Enforcer release adapter (zts.release). Pinned to a commit because
# Enforcer publishes no tags and is a 0.1.0 prototype. Needs the cns extra as well.
enforcer = ["tack-enforcer @ git+https://github.com/wking53214/Enforcer.git@e4d5688e1564d91ded7d5337e93c0b734375d073"]
# Optional: zts.trust and zts.status, the Ed25519 grant verifier and the HTTPS status client.
trust = ["cryptography>=42"]
# Optional: zts.replay_postgres, the shared replay store. The server is yours; this is only the client.
replay-postgres = ["psycopg[binary]>=3.1"]
# Optional: zts.anchor_tsa, the RFC 3161 ledger anchor.
tsa = ["cryptography>=42", "asn1crypto>=1.5"]
# Everything a production deployment of the Enforcer path uses.
production = ["cryptography>=42", "asn1crypto>=1.5", "psycopg[binary]>=3.1", "cns @ git+https://github.com/wking53214/CNS.git@v2.3.0", "tack-enforcer @ git+https://github.com/wking53214/Enforcer.git@e4d5688e1564d91ded7d5337e93c0b734375d073"]

[project.scripts]
zts = "zts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
# A fixture imported from a helper module and then named as a test argument is how pytest shares fixtures.
"tests/*" = ["F811"]
