[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zts"
version = "13.0.0"
description = "Zero Trust Stack: a deterministic linguistic filtration array (G1-G7)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "William N. King" }]
keywords = ["llm", "filter", "governance", "middleware", "sycophancy", "zero-trust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Filters",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Static checks run in CI: the type checker and coverage reporting. Pinned exactly, so a new release
# of either cannot change the result without a deliberate bump here.
static = ["mypy==2.4.1", "pytest-cov==7.1.0", "coverage==7.17.5"]
# Optional: the CNS dock (zts.cns). Nothing else in ZTS imports CNS, and ZTS runs without it.
cns = ["cns @ git+https://github.com/wking53214/CNS.git@v4.1.0"]
# Optional: the Enforcer release adapter (zts.release). Pinned to a commit because
# Enforcer publishes no tags and is a 0.1.0 prototype. Needs the cns extra as well.
enforcer = ["tack-enforcer @ git+https://github.com/wking53214/Enforcer.git@e4d5688e1564d91ded7d5337e93c0b734375d073"]
# Optional: zts.trust and zts.status, the Ed25519 grant verifier and the HTTPS status client.
trust = ["cryptography>=42"]
# Optional: zts.replay_postgres, the shared replay store. The server is yours; this is only the client.
replay-postgres = ["psycopg[binary]>=3.1"]
# Optional: zts.anchor_tsa, the RFC 3161 ledger anchor.
tsa = ["cryptography>=42", "asn1crypto>=1.5"]
# Everything a production deployment of the Enforcer path uses.
production = ["cryptography>=42", "asn1crypto>=1.5", "psycopg[binary]>=3.1", "cns @ git+https://github.com/wking53214/CNS.git@v4.1.0", "tack-enforcer @ git+https://github.com/wking53214/Enforcer.git@e4d5688e1564d91ded7d5337e93c0b734375d073"]

[project.scripts]
zts = "zts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
# A fixture imported from a helper module and then named as a test argument is how pytest shares fixtures.
"tests/*" = ["F811"]

[tool.mypy]
# Checks src/zts. Run as: mypy (from the repository root, with the production and static extras installed).
files = ["src/zts"]
python_version = "3.11"
# Every "type: ignore" in src marks a spot that is guarded at runtime and says how; one that stops
# being needed is reported, so stale ones cannot pile up.
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
# Third-party packages that ship no type information (no py.typed marker, no stubs).
module = ["enforcer", "enforcer.*", "asn1crypto", "asn1crypto.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["zts"]

[tool.coverage.report]
# The floor: branch coverage was 94.2% on 2026-11-26 with the root-only tests skipped, as CI skips
# them. It is set at the 94% recorded in the 2026-11-25 baseline, so one timing-dependent branch
# cannot fail the job by itself. Raise it, never lower it, when coverage rises.
fail_under = 94.0
precision = 1
show_missing = false
skip_covered = true
