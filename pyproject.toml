[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zts"
version = "13.0.0"
description = "Zero Trust Stack: a deterministic linguistic filtration array (G1-G7)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "William N. King" }]
keywords = ["llm", "filter", "governance", "middleware", "sycophancy", "zero-trust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Filters",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Optional: the CNS dock (zts.cns). Nothing else in ZTS imports CNS, and ZTS runs without it.
cns = ["cns @ git+https://github.com/wking53214/CNS.git@v2.3.0"]
# Optional: the Enforcer release adapter (zts.release). Pinned to a commit because
# Enforcer publishes no tags and is a 0.1.0 prototype. Needs the cns extra as well.
enforcer = ["tack-enforcer @ git+https://github.com/wking53214/Enforcer.git@3ff6a56a0c417a83e3b002feed6bdec4175454f3"]

[project.scripts]
zts = "zts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
